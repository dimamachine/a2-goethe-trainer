<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Goethe A2 Prüfungstraining">
  <defs>
    <style>
      @font-face{font-family:'Fraunces';font-style:italic;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
      @font-face{font-family:'JBMono';font-style:normal;font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}
      .hero{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:400;}
      .mono{font-family:'JBMono','JetBrains Mono',ui-monospace,Menlo,monospace;font-weight:500;}
    </style>
    <radialGradient id="g1" cx="22%" cy="0%" r="75%">
      <stop offset="0" stop-color="#E85D44" stop-opacity="0.11"/><stop offset="0.55" stop-color="#E85D44" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="86%" cy="100%" r="75%">
      <stop offset="0" stop-color="#E5C158" stop-opacity="0.07"/><stop offset="0.55" stop-color="#E5C158" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1280" height="400" fill="#14120E"/>
  <rect width="1280" height="400" fill="url(#g1)"/>
  <rect width="1280" height="400" fill="url(#g2)"/>
  <rect width="1280" height="400" filter="url(#noise)" opacity="0.04"/>
  <rect x="20.5" y="20.5" width="1239" height="359" fill="none" stroke="#2D2A23" stroke-width="1.5"/>

  <g transform="translate(623,68)">
    <rect width="34" height="7" y="0"  fill="#1a1a1a"/>
    <rect width="34" height="7" y="7"  fill="#DD0000"/>
    <rect width="34" height="7" y="14" fill="#FFCE00"/>
    <rect width="34" height="21" fill="none" stroke="#453F31" stroke-width="1"/>
  </g>

  <text class="mono" x="637" y="126" text-anchor="middle" font-size="14" letter-spacing="5" fill="#918876">GOETHE-ZERTIFIKAT · DEUTSCH</text>
  <text class="hero" x="640" y="234" text-anchor="middle" font-size="104" fill="#F5EDDC">Goethe <tspan fill="#E85D44">A2</tspan></text>
  <rect x="580" y="262" width="120" height="2.5" fill="#E85D44"/>
  <text class="mono" x="635" y="312" text-anchor="middle" font-size="19" letter-spacing="9" fill="#F5EDDC">PRÜFUNGSTRAINING</text>
  <text class="mono" x="639" y="356" text-anchor="middle" font-size="14" letter-spacing="2" fill="#918876">Lesen <tspan fill="#E85D44">·</tspan> Hören <tspan fill="#E85D44">·</tspan> Schreiben <tspan fill="#E85D44">·</tspan> Sprechen</text>
</svg>
